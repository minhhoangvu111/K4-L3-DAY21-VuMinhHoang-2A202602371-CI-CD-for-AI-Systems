name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần cloud storage)
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: unit-test         # Chỉ chạy khi job unit-test qua
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo "${{ secrets.STORAGE_CREDENTIALS }}" > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          credentials_path = "/tmp/sa-key.json"
          os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = credentials_path

          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          source_file = "models/model.joblib"
          destination_blob = "artifacts/current/model.joblib"

          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob(destination_blob)
          blob.upload_from_filename(source_file)

          print(f"File {source_file} uploaded to gs://{bucket_name}/{destination_blob}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép triển khai khi f1_score >= 0.65
  #   Lưu ý: ngưỡng đặt trên f1_score chứ KHÔNG phải accuracy. Dữ liệu có tỷ lệ
  #   lớp 75/25, nên một mô hình đoán bừa đã đạt accuracy 0.75 mà hoàn toàn vô dụng.
  quality-gate:
    name: Quality Gate
    needs: train             # Chỉ chạy khi job train qua
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65

          if f1 < threshold:
              print(f"Quality gate FAILED: f1_score={f1:.4f} < {threshold}")
              exit(1)
          else:
              print(f"Quality gate PASSED: f1_score={f1:.4f} >= {threshold}")
          PYEOF

  # JOB 4: Triển khai sau khi quality gate qua
  release:
    name: Release
    needs: quality-gate      # Chỉ chạy khi job quality-gate qua
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -f http://localhost:8080/healthz || exit 1
